#nouvelle config:
quality:
  min_det_score: 0.6
  min_face_size: 50
  min_sharpness: 40.0        # variance du Laplacien, à calibrer

embedding:
  use_flip: true
  use_clahe: false

clustering:
  method: agglomerative       # agglomerative | dbscan
  distance_threshold: 0.60
  attach_threshold: 0.35
  merge_threshold: 0.55

output:
  crop_margin: 0.25
  copy_originals: false
  overwrite: true
