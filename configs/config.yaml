model:
  backend: insightface
  name: buffalo_l
  det_size: [640, 640]
  providers: [CPUExecutionProvider]

detection:
  min_det_score: 0.5
  min_face_size: 40

matching:
  threshold: 0.40
  use_query_expansion: true
  expansion_top_k: 3
  use_gallery_clustering: false
  cluster_distance_threshold: 0.60

paths:
  cache_dir: data/cache
  output_dir: outputs
